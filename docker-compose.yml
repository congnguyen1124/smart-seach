services:
  api:
    build:
      context: .
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    image: smart-video-search-api:local
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hashing-demo-v1}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      DEFAULT_SEARCH_THRESHOLD: ${DEFAULT_SEARCH_THRESHOLD:-0.15}
      DEFAULT_SEARCH_LIMIT: ${DEFAULT_SEARCH_LIMIT:-10}
      MAX_SEARCH_LIMIT: ${MAX_SEARCH_LIMIT:-50}
      SEARCH_CANDIDATE_MULTIPLIER: ${SEARCH_CANDIDATE_MULTIPLIER:-5}
    init: true
    restart: unless-stopped
